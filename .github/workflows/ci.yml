name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma resolves DATABASE_URL through prisma.config.ts at CLI start-up.
      # No database is reached here: `validate` and `generate` are offline.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/donesi_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # backend/package.json defines no lint or test script, so the checks
      # below are what the toolchain can actually verify today.
      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Syntax-check sources
        run: find src prisma -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend (yarn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        # Pages fetch the API inside try/catch and fall back to empty data,
        # so the production build succeeds without a running backend.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
        run: yarn build
